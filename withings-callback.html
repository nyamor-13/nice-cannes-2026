<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Autorisation Withings</title>
<style>
:root{--bg:#0e141e;--card:#161f2d;--tx:#e6ebf2;--tx2:#9ba7b7;--acc:#76a5ff;--ok:#4fc28b;--ko:#ff8a80}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,sans-serif;padding:32px 16px}
main{max-width:34rem;margin:0 auto;background:var(--card);border-radius:14px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:1.4rem}
code{display:block;background:var(--bg);border-radius:8px;padding:12px;font:15px ui-monospace,Menlo,monospace;word-break:break-all}
button{justify-self:start;background:var(--acc);color:#0e141e;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
p{margin:0;color:var(--tx2)}
.ok{color:var(--ok)}.ko{color:var(--ko)}
</style>
</head>
<body>
<main id="m"></main>
<script>
// Page de retour OAuth Withings : n'envoie rien nulle part, affiche seulement le code
// d'autorisation (à usage unique, inutilisable sans le Client Secret resté sur le Mac)
// pour que Romain le colle dans le Terminal (withings-setup.py).
(function(){
  var p=new URLSearchParams(location.search), m=document.getElementById("m");
  var code=p.get("code"), err=p.get("error");
  if(code){
    m.innerHTML='<h1 class="ok">Autorisation reçue</h1><p>Copie ce code et colle-le dans le Terminal :</p><code id="c"></code><button id="b">Copier le code</button><p id="s"></p>';
    document.getElementById("c").textContent=code;
    document.getElementById("b").onclick=function(){
      navigator.clipboard.writeText(code).then(function(){document.getElementById("s").textContent="Copié. Retourne dans le Terminal.";},
        function(){document.getElementById("s").textContent="Sélectionne le code à la main et copie-le.";});
    };
  } else if(err){
    m.innerHTML='<h1 class="ko">Autorisation refusée ou annulée</h1><p>Relance le script dans le Terminal pour recommencer.</p>';
  } else {
    m.innerHTML='<h1>Page de retour Withings</h1><p>Cette page sert uniquement à l\'autorisation de l\'API Withings pour le suivi marathon.</p>';
  }
})();
</script>
</body>
</html>
